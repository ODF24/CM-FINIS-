<div class="actu-root">

  <!-- HERO -->
  <header class="actu-hero">
    <div class="hero-bg"></div>
    <div class="hero-content">
      <p class="eyebrow">📰 Congo Metaverse</p>
      <h1>Actualités</h1>
      <p class="hero-sub">Restez informés des dernières nouvelles du Congo</p>
    </div>
  </header>

  <!-- FILTRES -->
  <div class="filtres-wrap">
    <button *ngFor="let f of filtres" class="filtre-btn"
      [class.active]="filtreActif === f"
      (click)="filtreActif = f">
      {{ f | titlecase }}
    </button>
  </div>

  <!-- GRILLE ARTICLES -->
  <section class="articles-grid">
    <article *ngFor="let a of articlesFiltres; let i = index"
      class="article-card"
      [class.featured]="i === 0 && filtreActif === 'tout'">
      <div class="art-img">
        <img [src]="a.image" [alt]="a.titre" loading="lazy"/>
        <div class="art-img-overlay"></div>
        <span class="art-tag">{{ a.tag }}</span>
      </div>
      <div class="art-body">
        <p class="art-date">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="11" height="11"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          {{ a.date }}
        </p>
        <h3 class="art-titre">{{ a.titre }}</h3>
        <p class="art-extrait">{{ a.extrait }}</p>
        <button class="btn-lire">
          Lire la suite
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="13" height="13"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
      </div>
    </article>
  </section>

  <div *ngIf="articlesFiltres.length === 0" class="empty">
    <span>📭</span>
    <p>Aucun article dans cette catégorie pour l'instant.</p>
  </div>
</div>
